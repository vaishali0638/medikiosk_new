name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  forbidden_options:
    name: Forbidden-option scan
    runs-on: ubuntu-latest
    # Runs on its own so a violation is unmistakable in the checks list: these options
    # are banned for clinical-safety and governance reasons, not style.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run scan:forbidden

  ai_worker_contract:
    name: AI worker answers in the draft contract
    runs-on: ubuntu-latest
    # The worker is Python and the draft contract is TypeScript, so no compiler checks the
    # join. A worker that drifts out of the contract does not fail loudly: core_api
    # discards the response and composes the draft locally, for every patient, while the
    # worker's own health check stays green. This starts the real worker and validates
    # what it actually returns.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run aiworker:check

  flutter:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/kiosk_flutter/pubspec.yaml
      # android/ is committed, so there is no create step: `flutter create` would
      # overwrite the lock-task activity and the manifest that make this a kiosk.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  design_tokens_in_sync:
    name: Generated design tokens are in sync
    runs-on: ubuntu-latest
    # The Dart theme is generated from the TypeScript tokens. If someone edits the
    # generated file by hand the two surfaces drift apart, so CI regenerates and diffs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run tokens:build
      - run: git diff --exit-code -- apps/kiosk_flutter/lib/theme/design_tokens.dart

  database:
    name: Migrations, seed and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medikiosk
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: medikiosk_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://medikiosk:ci_only@localhost:5432/medikiosk_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migrations run from an empty database
        run: npm run migrate -w @medikiosk/core-api

      - name: Migrations are idempotent
        run: npm run migrate -w @medikiosk/core-api

      - name: Migrations reverse and re-apply cleanly
        run: npm run migrate:redo -w @medikiosk/core-api

      - name: Seed is idempotent
        run: |
          npm run seed -w @medikiosk/core-api
          npm run seed -w @medikiosk/core-api

      # Boots the COMPILED artifact, not the source. NestJS DI depends on
      # emitDecoratorMetadata, which is a property of the compiler rather than the code:
      # ts-jest emits it and esbuild does not, so a green test suite can sit alongside a
      # binary whose controllers have undefined dependencies. Only running dist/ catches it.
      - name: Smoke-test the compiled artifact
        run: |
          npm run build -w @medikiosk/core-api
          npm run smoke -w @medikiosk/core-api

      # Integration tests need an empty schema; the seed above proved its own path.
      - name: Reset and run integration tests
        run: |
          npm run migrate:reset -w @medikiosk/core-api
          npm run test:int -w @medikiosk/core-api
        env:
          DATABASE_URL: postgres://medikiosk:ci_only@localhost:5432/medikiosk_ci

  openapi_in_sync:
    name: Generated OpenAPI is in sync
    runs-on: ubuntu-latest
    # docs/api/openapi.json is derived from the Zod contracts. Regenerate and diff, so a
    # contract change cannot ship without the published document following it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @medikiosk/api-contracts
      - run: git diff --exit-code -- docs/api/openapi.json
